# Browser verification for the Keystone site and Client Build Studio.
#
# The site is static with no build step, so this runs it exactly as a
# contributor does — python3 -m http.server from the repo root — and drives it
# with the same Playwright suite that lives in test/.
#
# A red build here means one of: a console error or CSP violation on a page, an
# external request, horizontal overflow at 390px, the spine failing validation,
# a criterion naming an unregistered test, a renderer drawing nothing, the
# preview frame becoming readable from the parent, the Gate certifying what it
# should refuse, or script surviving into the exported deliverable.

name: verify

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        working-directory: test
        run: npm ci

      - name: Install Chromium
        working-directory: test
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: test
        run: npx playwright test

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test/playwright-report/
            test/test-results/
          retention-days: 14
          if-no-files-found: ignore
